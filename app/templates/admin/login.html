<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · PrintShop OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <form method="post" action="/admin/login" class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl space-y-4">
    <div>
      <div class="text-xs font-semibold text-blue-600 uppercase tracking-wide">PrintShop OS</div>
      <h1 class="text-2xl font-bold mt-1">Masuk Admin</h1>
      <p class="text-sm text-slate-500">Kasir · Produksi · Owner</p>
    </div>
    {% if error %}
    <div class="rounded-xl bg-rose-50 text-rose-700 border border-rose-200 px-3 py-2 text-sm">{{ error }}</div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium mb-1">Username</label>
      <input class="w-full rounded-xl border px-3 py-2" name="username" required autofocus value="admin">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input class="w-full rounded-xl border px-3 py-2" type="password" name="password" required>
    </div>
    <button class="w-full rounded-xl bg-blue-600 text-white font-semibold py-2.5 hover:bg-blue-700" type="submit">Login</button>
    <a href="/" class="block text-center text-sm text-slate-500 hover:text-slate-800">← Kembali ke portal</a>
  </form>
</body>
</html>
