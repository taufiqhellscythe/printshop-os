{% extends "base_admin.html" %}
{% block title %}Kasir POS · PrintShop OS{% endblock %}
{% block content %}
<div class="max-w-xl">
  <h1 class="text-2xl font-bold mb-1">Kasir POS</h1>
  <p class="text-sm text-slate-500 mb-4">Order walk-in cepat — ideal di meja kasir.</p>
  {% if error %}
  <div class="mb-3 rounded-xl bg-rose-50 text-rose-700 border px-3 py-2 text-sm">{{ error }}</div>
  {% endif %}
  <form method="post" class="rounded-2xl bg-white border p-5 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2 sm:col-span-1">
        <label class="label">Nama pelanggan</label>
        <input class="input" name="customer_name" value="Walk-in">
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="label">HP</label>
        <input class="input" name="customer_phone" placeholder="opsional">
      </div>
    </div>
    <div>
      <label class="label">Layanan</label>
      <select class="input" name="service_key" id="pos-service">
        {% for s in services %}
        <option value="{{ s.key }}">{{ s.name }} — {{ rupiah(s.price) }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="label">Qty</label>
      <input class="input" type="number" name="qty" id="pos-qty" value="1" min="1">
    </div>
    <div>
      <label class="label">Add-on</label>
      <div class="grid grid-cols-1 gap-1">
        {% for a in addons %}
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="pos-addon" name="addon_keys" value="{{ a.key }}"> {{ a.name }} ({{ rupiah(a.price) }})</label>
        {% endfor %}
      </div>
    </div>
    <div>
      <label class="label">Catatan</label>
      <input class="input" name="notes">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="label">Metode bayar</label>
        <select class="input" name="payment_method">
          <option>Tunai</option><option>Transfer</option><option>QRIS</option><option>E-Wallet</option>
        </select>
      </div>
      <div>
        <label class="label">Bayar sekarang?</label>
        <select class="input" name="pay_now">
          <option value="yes">Ya — lunas</option>
          <option value="no">Belum</option>
        </select>
      </div>
    </div>
    <div class="rounded-xl bg-blue-50 p-3">
      <div class="text-xs text-blue-600">Total</div>
      <div class="text-2xl font-bold text-blue-800" id="pos-total">—</div>
    </div>
    <button class="btn btn-primary w-full py-3" type="submit">Buat Order</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
async function posQuote(){
  const service = document.getElementById('pos-service').value;
  const qty = document.getElementById('pos-qty').value || 1;
  const addons = [...document.querySelectorAll('.pos-addon:checked')].map(x=>x.value).join(',');
  const r = await fetch(`/api/quote?service_key=${encodeURIComponent(service)}&qty=${qty}&addons=${encodeURIComponent(addons)}`);
  const data = await r.json();
  if(data.ok) document.getElementById('pos-total').textContent = data.total_fmt;
}
document.getElementById('pos-service').addEventListener('change', posQuote);
document.getElementById('pos-qty').addEventListener('input', posQuote);
document.querySelectorAll('.pos-addon').forEach(el=>el.addEventListener('change', posQuote));
posQuote();
</script>
{% endblock %}
